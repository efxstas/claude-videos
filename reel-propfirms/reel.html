<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel Prop Firms EV</title>
<style>
  @font-face { font-family: "Inter"; src: url(assets/fonts/Inter.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "JBM"; src: url(assets/fonts/JetBrainsMono.woff2) format("woff2"); font-weight: 700; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================
//  CONFIG
// ============================================================
const params = new URLSearchParams(location.search);
const CONFIG = {
  handle: params.get("handle") || "@tu_handle",
  captions: params.get("captions") !== "0",
};
const W = 1080, H = 1920;
const DURATION = 66;

const C = {
  green: "#22c55e", greenSoft: "#4ade80", red: "#ef4444", redSoft: "#f87171",
  gold: "#facc15", white: "#ffffff", ink: "#0b0f17", panel: "rgba(14,18,28,0.92)",
  panelLine: "rgba(255,255,255,0.10)", muted: "rgba(255,255,255,0.62)",
  claude: "#d97757", user: "#2b3445",
};
const F = (w, s, fam = "Inter") => `${w} ${s}px ${fam}, DejaVu Sans, sans-serif`;

// ============================================================
//  HELPERS
// ============================================================
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const backOut = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const p = (t, a, b) => clamp((t - a) / (b - a));          // linear 0..1
const pe = (t, a, b, e = easeOut) => e(p(t, a, b));        // eased 0..1
// scene alpha: fades in over [a, a+fi], out over [b-fo, b]
const sceneAlpha = (t, a, b, fi = .35, fo = .35) => Math.min(p(t, a, a + fi), 1 - p(t, b - fo, b));
const fmt = n => Math.round(n).toLocaleString("es-ES").replace(/ /g, ".").replace(/\s/g, ".");
const fmtThousands = n => { const s = Math.round(n).toString(); return s.replace(/\B(?=(\d{3})+(?!\d))/g, "."); };

let ctx;
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(s, x, y, font, color = C.white, align = "center", base = "middle") {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
}
function wrap(s, maxW, font) {
  ctx.font = font; const words = s.split(" "); const lines = []; let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line); return lines;
}
function withAlpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
function shadow(blur = 30, color = "rgba(0,0,0,.45)", oy = 10) { ctx.shadowBlur = blur; ctx.shadowColor = color; ctx.shadowOffsetY = oy; }
function noShadow() { ctx.shadowBlur = 0; ctx.shadowColor = "transparent"; ctx.shadowOffsetY = 0; }
// deterministic pseudo-random
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ============================================================
//  ASSETS
// ============================================================
const imgBg = new Image(); imgBg.src = "assets/fondo-chart.png";
const imgPayout = new Image(); imgPayout.src = "assets/payout-lucid.png";

// ============================================================
//  BACKGROUND (the user's chart, slow pan + dark grade)
// ============================================================
function drawBackground(t) {
  const ih = imgBg.naturalHeight, iw = imgBg.naturalWidth;
  const s = H / ih * 1.04;
  const dw = iw * s, dh = ih * s;
  const maxX = dw - W;
  const x = -maxX * easeInOut(clamp(t / DURATION));
  const y = -(dh - H) / 2 + Math.sin(t * .25) * 6;
  ctx.drawImage(imgBg, x, y, dw, dh);
  // grade: dark navy tint so the gray chart reads as a moody trading screen
  ctx.fillStyle = "rgba(6,10,20,0.70)"; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * .45, 200, W / 2, H * .5, H * .75);
  g.addColorStop(0, "rgba(30,60,120,0.10)"); g.addColorStop(1, "rgba(0,0,0,0.65)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ============================================================
//  COMMON UI
// ============================================================
function claudeIcon(cx, cy, r, t = 0, color = C.claude) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * .6);
  ctx.strokeStyle = color; ctx.lineCap = "round"; ctx.lineWidth = r * .22;
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2, len = r * (i % 2 ? .78 : 1);
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * .18, Math.sin(a) * r * .18); ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len); ctx.stroke();
  }
  ctx.restore();
}
function chip(label, t, a, b) {
  const al = sceneAlpha(t, a, b, .4, .3);
  withAlpha(al, () => {
    ctx.font = F(800, 26); const w = ctx.measureText(label).width + 48;
    rr(W / 2 - w / 2, 214, w, 50, 25); ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 2; ctx.stroke();
    text(label, W / 2, 240, F(800, 26), "rgba(255,255,255,0.85)");
  });
}
// AI headline bubble used from scene 2 onward
function aiBubble(msg, t, a, b, y = 290, opts = {}) {
  const al = sceneAlpha(t, a, b, .35, .3);
  if (al <= 0) return;
  const k = pe(t, a, a + .45, backOut);
  const font = F(700, opts.size || 38);
  const lines = wrap(msg, 760, font);
  const lh = (opts.size || 38) * 1.28;
  const bh = Math.max(110, lines.length * lh + 52);
  // streaming text: reveal characters
  const total = msg.length;
  const shown = Math.floor(total * p(t, a + .15, a + .15 + Math.min(1.6, total * .028)));
  withAlpha(al, () => {
    ctx.save(); ctx.translate(0, (1 - k) * 30);
    shadow(40, "rgba(0,0,0,.5)", 14);
    rr(60, y, 960, bh, 30); ctx.fillStyle = C.panel; ctx.fill(); noShadow();
    ctx.strokeStyle = "rgba(217,119,87,0.45)"; ctx.lineWidth = 2.5; ctx.stroke();
    claudeIcon(118, y + 56, 26, t, C.claude);
    let count = 0;
    lines.forEach((ln, i) => {
      const rem = clamp(shown - count, 0, ln.length);
      text(ln.slice(0, rem), 170, y + 26 + lh / 2 + i * lh, font, C.white, "left");
      count += ln.length + 1;
    });
    ctx.restore();
  });
  return bh;
}
function formulaBox(str, t, a, b, y = 1385, color = C.white, size = 44) {
  const al = sceneAlpha(t, a, b, .35, .3);
  withAlpha(al, () => {
    const k = pe(t, a, a + .5, backOut);
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(.85 + .15 * k, .85 + .15 * k);
    ctx.font = F(700, size, "JBM"); const w = Math.min(1000, ctx.measureText(str).width + 70);
    shadow(30, "rgba(0,0,0,.5)", 8);
    rr(-w / 2, -48, w, 96, 22); ctx.fillStyle = "rgba(0,0,0,0.72)"; ctx.fill(); noShadow();
    ctx.strokeStyle = "rgba(250,204,21,0.55)"; ctx.lineWidth = 2.5; ctx.stroke();
    text(str, 0, 2, F(700, size, "JBM"), color);
    ctx.restore();
  });
}

// ============================================================
//  CHARACTER (minimal "muñeco")
// ============================================================
function cashBundle(x, y, s = 1, rot = 0, label = "1.000 $") {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  for (let i = 3; i >= 0; i--) {
    rr(-70 + i * 3, -38 - i * 5, 140, 76, 8); ctx.fillStyle = i ? "#15803d" : "#22a355"; ctx.fill();
    ctx.strokeStyle = "#0d5c2b"; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.fillStyle = "#fef3c7"; ctx.fillRect(-14, -38, 28, 76);
  text("$", -42, 0, F(900, 34), "#bbf7d0"); text("$", 42, 0, F(900, 34), "#bbf7d0");
  ctx.restore();
  if (label) text(label, x, y + 66 * s, F(900, 30 * s), C.greenSoft);
}
function figure(x, y, s, t, opts = {}) {
  // x,y = feet center
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const bob = Math.sin(t * 3) * 3;
  ctx.strokeStyle = "#f1f5f9"; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 14;
  // legs
  ctx.beginPath(); ctx.moveTo(-28, 0); ctx.lineTo(-10, -120); ctx.lineTo(10, -120); ctx.lineTo(28, 0); ctx.stroke();
  // body
  rr(-46, -260 + bob, 92, 150, 40); ctx.fillStyle = "#334155"; ctx.fill(); ctx.stroke();
  // head
  ctx.beginPath(); ctx.arc(0, -318 + bob, 48, 0, Math.PI * 2); ctx.fillStyle = "#f1f5f9"; ctx.fill();
  // eyes
  ctx.fillStyle = C.ink;
  const look = opts.look || 0;
  ctx.beginPath(); ctx.arc(-15 + look * 8, -322 + bob, 6, 0, 7); ctx.arc(15 + look * 8, -322 + bob, 6, 0, 7); ctx.fill();
  // smile
  ctx.strokeStyle = C.ink; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(look * 6, -306 + bob, 14, .2 * Math.PI, .8 * Math.PI); ctx.stroke();
  // arms
  ctx.strokeStyle = "#f1f5f9"; ctx.lineWidth = 14;
  const raise = opts.raise ?? 0;
  ctx.beginPath(); ctx.moveTo(-40, -230 + bob); ctx.lineTo(-90, -170 + bob - raise * 60); ctx.lineTo(-70 + raise * 10, -120 + bob - raise * 120); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(40, -230 + bob); ctx.lineTo(90, -170 + bob - raise * 60); ctx.lineTo(70 - raise * 10, -120 + bob - raise * 120); ctx.stroke();
  ctx.restore();
  return { handY: y + s * (-120 + bob - raise * 120), handX: x };
}

// ============================================================
//  SCENE 1 + 2 : chat with the AI
// ============================================================
const Q = "Tengo 1.000 $ y un 52 % de winrate. ¿Puedo ser rentable con prop firms?";
const A1 = "Sí. Primero tienes que entender el EV: el valor esperado. Lo que ganas de media cada vez que repites algo.";

function chatPanel(t) {
  // visible 0 → ~7.6, then collapses
  const appear = pe(t, 0.05, .6, backOut);
  const collapse = pe(t, 6.9, 7.7, easeInOut);
  if (t > 7.7) return;
  const al = Math.min(p(t, 0, .4), 1 - p(t, 7.3, 7.7));
  withAlpha(al, () => {
    const x = 60, w = 960, y = 300 - collapse * 60, h = 780;
    ctx.save(); ctx.translate(W / 2, y + h / 2); ctx.scale(.9 + .1 * appear, .9 + .1 * appear); ctx.translate(-W / 2, -(y + h / 2));
    shadow(60, "rgba(0,0,0,.6)", 20);
    rr(x, y, w, h, 36); ctx.fillStyle = C.panel; ctx.fill(); noShadow();
    ctx.strokeStyle = C.panelLine; ctx.lineWidth = 2; ctx.stroke();
    // header
    claudeIcon(x + 62, y + 62, 24, t);
    text("Claude", x + 104, y + 62, F(800, 36), C.white, "left");
    text("● en línea", x + w - 40, y + 62, F(600, 26), C.greenSoft, "right");
    ctx.fillStyle = C.panelLine; ctx.fillRect(x, y + 118, w, 2);

    // input bar
    const iy = y + h - 120;
    rr(x + 30, iy, w - 60, 90, 45); ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.14)"; ctx.stroke();
    const typed = Math.floor(Q.length * p(t, .6, 3.4));
    const sent = t >= 3.7;
    const inFont = F(500, 30);
    if (!sent) {
      const s = Q.slice(0, typed);
      ctx.save(); rr(x + 30, iy, w - 690 + 630, 90, 45); ctx.clip();
      ctx.font = inFont; const tw = ctx.measureText(s).width;
      const off = Math.max(0, tw - (w - 230));
      text(s || "Pregunta lo que quieras…", x + 70 - off, iy + 46, inFont, s ? C.white : "rgba(255,255,255,.35)", "left");
      if (Math.floor(t * 2.2) % 2 === 0 || (t > .6 && t < 3.4)) { ctx.fillStyle = C.white; ctx.fillRect(x + 74 + tw - off, iy + 26, 3, 40); }
      ctx.restore();
    } else text("Pregunta lo que quieras…", x + 70, iy + 46, inFont, "rgba(255,255,255,.35)", "left");
    // send button
    const pulse = t > 3.3 && t < 3.8 ? 1 + Math.sin((t - 3.3) * 20) * .08 : 1;
    ctx.save(); ctx.translate(x + w - 76, iy + 45); ctx.scale(pulse, pulse);
    ctx.beginPath(); ctx.arc(0, 0, 32, 0, 7); ctx.fillStyle = typed > 0 && !sent ? C.claude : "rgba(255,255,255,.15)"; ctx.fill();
    ctx.strokeStyle = C.white; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, 13); ctx.lineTo(0, -13); ctx.moveTo(-11, -2); ctx.lineTo(0, -13); ctx.lineTo(11, -2); ctx.stroke();
    ctx.restore();

    // messages
    let my = y + 160;
    if (sent) {
      const k = pe(t, 3.7, 4.1, backOut);
      const font = F(600, 34); const lines = wrap(Q, 640, font); const lh = 46;
      const bw = 700, bh = lines.length * lh + 44;
      ctx.save(); ctx.globalAlpha *= p(t, 3.7, 3.9); ctx.translate(0, (1 - k) * 80);
      rr(x + w - 30 - bw, my, bw, bh, 28); ctx.fillStyle = C.user; ctx.fill();
      lines.forEach((ln, i) => text(ln, x + w - 30 - bw + 32, my + 22 + lh / 2 + i * lh, font, C.white, "left"));
      ctx.restore();
      my += bh + 34;
    }
    // AI typing / answer
    if (t >= 4.2) {
      claudeIcon(x + 66, my + 34, 22, t * 2);
      if (t < 5.25) {
        for (let i = 0; i < 3; i++) {
          const yy = Math.sin(t * 9 - i * .8) * 6;
          ctx.beginPath(); ctx.arc(x + 130 + i * 30, my + 34 + yy, 9, 0, 7); ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.fill();
        }
      } else {
        const font = F(600, 36); const lines = wrap(A1, 760, font); const lh = 50;
        const shown = Math.floor(A1.length * p(t, 5.25, 6.6));
        let count = 0;
        lines.forEach((ln, i) => {
          const rem = clamp(shown - count, 0, ln.length);
          text(ln.slice(0, rem), x + 112, my + 34 + i * lh, font, C.white, "left");
          count += ln.length + 1;
        });
      }
    }
    ctx.restore();
  });
}

function scene1(t) {
  if (t > 7.8) return;
  chip("1.000 $ · 52 % WR · PROP FIRMS", t, 0, 15);
  chatPanel(t);
  // character with cash in front of the screen (visible in scene 1 only)
  const al = Math.min(p(t, .2, .8), 1 - p(t, 4.6, 5.2));
  withAlpha(al, () => {
    const k = pe(t, .2, .9, backOut);
    const fx = 300, fy = 1640 + (1 - k) * 200;
    const hand = figure(fx, fy, .95, t, { look: 1, raise: .55 });
    cashBundle(fx + 150, hand.handY - 40, 1, -.15 + Math.sin(t * 2) * .04);
    // thought bubble
    withAlpha(pe(t, 1.0, 1.4), () => {
      rr(560, 1250, 420, 110, 55); ctx.fillStyle = "rgba(255,255,255,.95)"; ctx.fill();
      ctx.beginPath(); ctx.arc(520, 1380, 16, 0, 7); ctx.arc(480, 1415, 9, 0, 7); ctx.fill();
      text("¿52 % basta?", 770, 1305, F(900, 44), C.ink);
    });
  });
}

// ============================================================
//  SCENE 2 : EV + balanza
// ============================================================
function coinsPile(cx, baseY, n, color, dark, shownN) {
  // pile of small coins (ellipses), bottom row widest
  const rows = [13, 12, 11, 9, 7, 4, 2, 1, 1];
  let idx = 0;
  for (let r = 0; r < rows.length && idx < n; r++) {
    const cnt = Math.min(rows[r], n - idx);
    for (let i = 0; i < cnt; i++, idx++) {
      if (idx >= shownN) return;
      const xx = cx + (i - (cnt - 1) / 2) * 19;
      const yy = baseY - r * 13;
      ctx.beginPath(); ctx.ellipse(xx, yy + 3, 11, 6, 0, 0, 7); ctx.fillStyle = dark; ctx.fill();
      ctx.beginPath(); ctx.ellipse(xx, yy, 11, 6, 0, 0, 7); ctx.fillStyle = color; ctx.fill();
    }
  }
}
function scene2(t) {
  if (t < 4.8 || t > 15.2) return;
  chip("01 · ¿QUÉ ES EL EV?", t, 7.2, 15);
  aiBubble("Con un 52 % de acierto a ratio 1:1, cada trade te deja de media +4 % de lo que arriesgas.", t, 7.2, 15);
  const al = sceneAlpha(t, 7.5, 15, .4, .35);
  withAlpha(al, () => {
    const cx = W / 2, pivotY = 760;
    const drop = p(t, 8.0, 10.6);
    const nG = Math.floor(52 * drop), nR = Math.floor(48 * drop);
    // tilt: balanced while filling, then leans a bit to green
    const ang = (nG - nR) * 0.012 + pe(t, 10.6, 11.6, backOut) * 0.06 + Math.sin(t * 1.5) * .004;
    // post
    ctx.fillStyle = "#cbd5e1";
    rr(cx - 10, pivotY, 20, 420, 8); ctx.fill();
    rr(cx - 120, pivotY + 410, 240, 26, 12); ctx.fill();
    // beam
    ctx.save(); ctx.translate(cx, pivotY); ctx.rotate(-ang);
    rr(-330, -10, 660, 20, 10); ctx.fillStyle = "#e2e8f0"; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, pivotY, 20, 0, 7); ctx.fillStyle = C.gold; ctx.fill();
    // pans
    const ends = [-1, 1].map(sx => ({ x: cx + sx * 310 * Math.cos(ang), y: pivotY + sx * 310 * Math.sin(ang) }));
    // note: rotate(-ang) → left end goes down when ang>0
    ends[0].y = pivotY + 310 * Math.sin(ang); ends[1].y = pivotY - 310 * Math.sin(ang);
    const panDefs = [
      { e: ends[0], color: C.green, dark: "#166534", n: 52, shown: nG, label: "52 × +1R", lc: C.greenSoft },
      { e: ends[1], color: C.red, dark: "#7f1d1d", n: 48, shown: nR, label: "48 × −1R", lc: C.redSoft },
    ];
    for (const d of panDefs) {
      const px = d.e.x, py = d.e.y + 170;
      ctx.strokeStyle = "rgba(226,232,240,.8)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(d.e.x, d.e.y); ctx.lineTo(px - 125, py); ctx.moveTo(d.e.x, d.e.y); ctx.lineTo(px + 125, py); ctx.stroke();
      coinsPile(px, py - 8, d.n, d.color, d.dark, d.shown);
      ctx.beginPath(); ctx.moveTo(px - 140, py); ctx.quadraticCurveTo(px, py + 70, px + 140, py); ctx.closePath();
      ctx.fillStyle = "#94a3b8"; ctx.fill();
      text(d.label, px, py + 100, F(900, 40), d.lc);
      text(String(d.shown), px, py + 150, F(700, 30, "JBM"), C.muted);
    }
    // falling coins
    for (let i = 0; i < 6; i++) {
      const ph = (t * 2.2 + i / 6) % 1;
      if (t > 8 && t < 10.5) {
        const side = i % 2 ? 1 : -1;
        const x = cx + side * 310, y = lerp(560, ends[i % 2].y + 120, ph);
        withAlpha(1 - ph * .3, () => {
          ctx.beginPath(); ctx.ellipse(x + Math.sin(i) * 40, y, 11, 6 + Math.abs(Math.sin(ph * 9)) * 5, 0, 0, 7);
          ctx.fillStyle = side < 0 ? C.green : C.red; ctx.fill();
        });
      }
    }
  });
  formulaBox("EV = 0,52×1R − 0,48×1R = +0,04R", t, 11.6, 15, 1385, C.gold, 40);
  withAlpha(sceneAlpha(t, 12.6, 15), () => text("Pequeño, pero POSITIVO", W / 2, 1300, F(900, 40), C.greenSoft));
}

// ============================================================
//  SCENE 3 : 10 cuentas
// ============================================================
function cardPos(i, layout) {
  const col = i % 5, row = Math.floor(i / 5);
  return { x: layout.x0 + col * (layout.w + layout.gap), y: layout.y0 + row * (layout.h + layout.gap) };
}
function accountCard(x, y, w, h, opts = {}) {
  const { dim = 0, glow = 0, price = true } = opts;
  ctx.save();
  if (glow > 0) { ctx.shadowBlur = 40 * glow; ctx.shadowColor = "rgba(34,197,94,.9)"; }
  rr(x, y, w, h, 18);
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, "#1e293b"); g.addColorStop(1, "#0f172a");
  ctx.fillStyle = g; ctx.fill(); noShadow();
  ctx.strokeStyle = glow > 0 ? `rgba(74,222,128,${.4 + .6 * glow})` : "rgba(255,255,255,.18)"; ctx.lineWidth = glow > 0 ? 4 : 2; ctx.stroke();
  text("CUENTA", x + w / 2, y + h * .2, F(800, Math.round(w * .12)), C.muted);
  text("50K", x + w / 2, y + h * .43, F(900, Math.round(w * .3)), C.white);
  if (price) {
    rr(x + w * .18, y + h * .66, w * .64, h * .2, h * .1); ctx.fillStyle = "rgba(34,197,94,.18)"; ctx.fill();
    text("100 $", x + w / 2, y + h * .76, F(800, Math.round(w * .14)), C.greenSoft);
  }
  if (dim > 0) { rr(x, y, w, h, 18); ctx.fillStyle = `rgba(5,8,14,${.72 * dim})`; ctx.fill(); }
  ctx.restore();
}
const L3 = { x0: 75, y0: 560, w: 170, h: 230, gap: 20 };
function scene3(t) {
  if (t < 14.7 || t > 20.4) return;
  chip("02 · EL PLAN", t, 15, 20);

function coin(x, y, r, t0, t, win) {
  // spinning coin that lands at t0+0.9
  if (t < t0) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 3; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]); return; }
  const k = p(t, t0, t0 + .9);
  const jump = Math.sin(k * Math.PI) * 60;
  const landed = k >= 1;
  const sx = landed ? 1 : Math.abs(Math.cos(k * Math.PI * 6));
  const color = landed ? (win ? C.green : C.red) : C.gold;
  ctx.save(); ctx.translate(x, y - jump); ctx.scale(Math.max(.08, sx), 1);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 3; ctx.stroke();
  if (landed) {
    ctx.strokeStyle = C.white; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath();
    if (win) { ctx.moveTo(-r * .4, 0); ctx.lineTo(-r * .1, r * .3); ctx.lineTo(r * .45, -r * .35); }
    else { ctx.moveTo(-r * .35, -r * .35); ctx.lineTo(r * .35, r * .35); ctx.moveTo(r * .35, -r * .35); ctx.lineTo(-r * .35, r * .35); }
    ctx.stroke();
  } else text("$", 0, 1, F(900, r), "#78350f");
  ctx.restore();
}

  [45.2, 55.0, "27 % por 52 %: cada cuenta tiene un 14 % de llegar a payout. Con 10 cuentas, un 78 % de probabilidad de cobrar al menos una vez. Y el valor esperado del plan es de unos +770 dólares. Más un payout cada 5 días verdes mientras la cuenta siga viva."],
  [55.2, 59.8, "Y no es teoría. Aquí están mis payouts."],
];
// split each line into ~5-7 word chunks, timed by character count
const CAPS = [];
for (const [a, b, s] of VO) {
  const words = s.split(" "); const chunks = []; let cur = [];
  for (const w of words) { cur.push(w); if (cur.length >= 6 || /[.:,]$/.test(w) && cur.length >= 3) { chunks.push(cur.join(" ")); cur = []; } }
  if (cur.length) chunks.push(cur.join(" "));
  const tot = chunks.reduce((n, c) => n + c.length + 6, 0); let acc = a;
  for (const c of chunks) { const d = (b - a) * (c.length + 6) / tot; CAPS.push([acc, acc + d, c]); acc += d; }
}
const HL = /(\d[\d.,]*\s?%?|EV|\+?\d[\d.]*\s?\$|payout|positivo|fondeada|todo o nada)/i;
function captions(t) {
  if (!CONFIG.captions) return;
  const c = CAPS.find(c => t >= c[0] && t < c[1]);
  if (!c) return;
  const k = pe(t, c[0], c[0] + .12, backOut);
  const font = F(900, 46);
  const lines = wrap(c[2], 900, font);
  ctx.save(); ctx.translate(W / 2, 1530); ctx.scale(.9 + .1 * k, .9 + .1 * k);
  lines.forEach((ln, i) => {
    const y = (i - (lines.length - 1) / 2) * 58;
    ctx.font = font; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    const words = ln.split(" "); const total = ctx.measureText(ln).width; let x = -total / 2;
    for (const w of words) {
      const ww = ctx.measureText(w + " ").width;
      ctx.lineWidth = 10; ctx.strokeStyle = "rgba(0,0,0,.85)"; ctx.lineJoin = "round"; ctx.strokeText(w, x, y);
      ctx.fillStyle = HL.test(w) ? C.gold : C.white; ctx.fillText(w, x, y);
      x += ww;
    }
  });
  ctx.restore();
}

// ============================================================
//  MAIN
// ============================================================
function renderFrame(t) {
  ctx = document.getElementById("c").getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; noShadow();
  ctx.clearRect(0, 0, W, H);
  drawBackground(t);
  scene1(t); scene2(t); scene3(t); scene4(t); scene5(t); scene6(t); scene6b(t); scene7(t);
  if (t < 59.8) captions(t);
  // global fade in/out
  const fade = Math.max(1 - p(t, 0, .3), p(t, DURATION - .5, DURATION));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
window.renderFrame = renderFrame;
window.DURATION = DURATION;
window.ready = Promise.all([
  document.fonts.load(F(900, 40)), document.fonts.load(F(700, 40, "JBM")),
  imgBg.decode(), imgPayout.decode(),
]).then(() => document.fonts.ready);

// live preview when opened in a browser (no ?render)
if (!params.has("render")) {
  window.ready.then(() => {
    const start = performance.now() - (parseFloat(params.get("t")) || 0) * 1000;
    const loop = () => { renderFrame(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
  document.body.style.cssText = "display:flex;justify-content:center;background:#111";
  document.getElementById("c").style.cssText = "height:100vh;width:auto";
}
</script>
