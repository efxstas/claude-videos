<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SMT NQ vs ES</title>
<style>
  @font-face { font-family: "Inter"; src: url(assets/fonts/Inter.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "JBM"; src: url(assets/fonts/JetBrainsMono.woff2) format("woff2"); font-weight: 700; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================
//  CONFIG
// ============================================================
const params = new URLSearchParams(location.search);
const CONFIG = {
  handle: params.get("handle") || "@alt_stas",
  captions: params.get("captions") === "1",
};
const W = 1080, H = 1920;
const DURATION = 75;

const C = {
  green: "#22c55e", greenSoft: "#4ade80", red: "#ef4444", redSoft: "#f87171",
  gold: "#facc15", white: "#ffffff", ink: "#0b0f17", panel: "rgba(14,18,28,0.92)",
  panelLine: "rgba(255,255,255,0.10)", muted: "rgba(255,255,255,0.62)",
  claude: "#d97757", user: "#2b3445",
};
const F = (w, s, fam = "Inter") => `${w} ${s}px ${fam}, DejaVu Sans, sans-serif`;

// ============================================================
//  HELPERS
// ============================================================
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const backOut = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const p = (t, a, b) => clamp((t - a) / (b - a));          // linear 0..1
const pe = (t, a, b, e = easeOut) => e(p(t, a, b));        // eased 0..1
// scene alpha: fades in over [a, a+fi], out over [b-fo, b]
const sceneAlpha = (t, a, b, fi = .35, fo = .35) => Math.min(p(t, a, a + fi), 1 - p(t, b - fo, b));
const fmt = n => Math.round(n).toLocaleString("es-ES").replace(/ /g, ".").replace(/\s/g, ".");
const fmtThousands = n => { const s = Math.round(n).toString(); return s.replace(/\B(?=(\d{3})+(?!\d))/g, "."); };

let ctx;
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(s, x, y, font, color = C.white, align = "center", base = "middle") {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
}
function wrap(s, maxW, font) {
  ctx.font = font; const words = s.split(" "); const lines = []; let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line); return lines;
}
function withAlpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
function shadow(blur = 30, color = "rgba(0,0,0,.45)", oy = 10) { ctx.shadowBlur = blur; ctx.shadowColor = color; ctx.shadowOffsetY = oy; }
function noShadow() { ctx.shadowBlur = 0; ctx.shadowColor = "transparent"; ctx.shadowOffsetY = 0; }
// deterministic pseudo-random
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ============================================================
//  ASSETS
// ============================================================
const imgBg = new Image(); imgBg.src = "assets/fondo-escritorio.webp";

// ============================================================
//  BACKGROUND (the user's chart, slow pan + dark grade)
// ============================================================
function drawBackground(t) {
  const ih = imgBg.naturalHeight, iw = imgBg.naturalWidth;
  const s = H / ih * 1.04;
  const dw = iw * s, dh = ih * s;
  const maxX = dw - W;
  const x = -maxX * easeInOut(clamp(t / DURATION));
  const y = -(dh - H) / 2 + Math.sin(t * .25) * 6;
  ctx.drawImage(imgBg, x, y, dw, dh);
  // grade: dark navy tint so the gray chart reads as a moody trading screen
  ctx.fillStyle = "rgba(6,10,20,0.70)"; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * .45, 200, W / 2, H * .5, H * .75);
  g.addColorStop(0, "rgba(30,60,120,0.10)"); g.addColorStop(1, "rgba(0,0,0,0.65)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ============================================================
//  COMMON UI
// ============================================================
function claudeIcon(cx, cy, r, t = 0, color = C.claude) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * .6);
  ctx.strokeStyle = color; ctx.lineCap = "round"; ctx.lineWidth = r * .22;
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2, len = r * (i % 2 ? .78 : 1);
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * .18, Math.sin(a) * r * .18); ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len); ctx.stroke();
  }
  ctx.restore();
}
function chip(label, t, a, b) {
  const al = sceneAlpha(t, a, b, .4, .3);
  withAlpha(al, () => {
    ctx.font = F(800, 26); const w = ctx.measureText(label).width + 48;
    rr(W / 2 - w / 2, 214, w, 50, 25); ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 2; ctx.stroke();
    text(label, W / 2, 240, F(800, 26), "rgba(255,255,255,0.85)");
  });
}
// AI headline bubble used from scene 2 onward
function aiBubble(msg, t, a, b, y = 290, opts = {}) {
  const al = sceneAlpha(t, a, b, .35, .3);
  if (al <= 0) return;
  const k = pe(t, a, a + .45, backOut);
  const font = F(700, opts.size || 38);
  const lines = wrap(msg, 760, font);
  const lh = (opts.size || 38) * 1.28;
  const bh = Math.max(110, lines.length * lh + 52);
  // streaming text: reveal characters
  const total = msg.length;
  const shown = Math.floor(total * p(t, a + .15, a + .15 + Math.min(1.6, total * .028)));
  withAlpha(al, () => {
    ctx.save(); ctx.translate(0, (1 - k) * 30);
    shadow(40, "rgba(0,0,0,.5)", 14);
    rr(60, y, 960, bh, 30); ctx.fillStyle = C.panel; ctx.fill(); noShadow();
    ctx.strokeStyle = "rgba(217,119,87,0.45)"; ctx.lineWidth = 2.5; ctx.stroke();
    claudeIcon(118, y + 56, 26, t, C.claude);
    let count = 0;
    lines.forEach((ln, i) => {
      const rem = clamp(shown - count, 0, ln.length);
      text(ln.slice(0, rem), 170, y + 26 + lh / 2 + i * lh, font, C.white, "left");
      count += ln.length + 1;
    });
    ctx.restore();
  });
  return bh;
}
function formulaBox(str, t, a, b, y = 1385, color = C.white, size = 44) {
  const al = sceneAlpha(t, a, b, .35, .3);
  withAlpha(al, () => {
    const k = pe(t, a, a + .5, backOut);
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(.85 + .15 * k, .85 + .15 * k);
    ctx.font = F(700, size, "JBM"); const w = Math.min(1000, ctx.measureText(str).width + 70);
    shadow(30, "rgba(0,0,0,.5)", 8);
    rr(-w / 2, -48, w, 96, 22); ctx.fillStyle = "rgba(0,0,0,0.72)"; ctx.fill(); noShadow();
    ctx.strokeStyle = "rgba(250,204,21,0.55)"; ctx.lineWidth = 2.5; ctx.stroke();
    text(str, 0, 2, F(700, size, "JBM"), color);
    ctx.restore();
  });
}


function accountCard(x, y, w, h, opts = {}) {
  const { dim = 0, glow = 0, price = true } = opts;
  ctx.save();
  if (glow > 0) { ctx.shadowBlur = 40 * glow; ctx.shadowColor = "rgba(34,197,94,.9)"; }
  rr(x, y, w, h, 18);
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, "#1e293b"); g.addColorStop(1, "#0f172a");
  ctx.fillStyle = g; ctx.fill(); noShadow();
  ctx.strokeStyle = glow > 0 ? `rgba(74,222,128,${.4 + .6 * glow})` : "rgba(255,255,255,.18)"; ctx.lineWidth = glow > 0 ? 4 : 2; ctx.stroke();
  text("CUENTA", x + w / 2, y + h * .2, F(800, Math.round(w * .12)), C.muted);
  text("50K", x + w / 2, y + h * .43, F(900, Math.round(w * .3)), C.white);
  if (price) {
    rr(x + w * .18, y + h * .66, w * .64, h * .2, h * .1); ctx.fillStyle = "rgba(34,197,94,.18)"; ctx.fill();
    text("100 $", x + w / 2, y + h * .76, F(800, Math.round(w * .14)), C.greenSoft);
  }
  if (dim > 0) { rr(x, y, w, h, 18); ctx.fillStyle = `rgba(5,8,14,${.72 * dim})`; ctx.fill(); }
  ctx.restore();
}

function coin(x, y, r, t0, t, win) {
  // spinning coin that lands at t0+0.9
  if (t < t0) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 3; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]); return; }
  const k = p(t, t0, t0 + .9);
  const jump = Math.sin(k * Math.PI) * 60;
  const landed = k >= 1;
  const sx = landed ? 1 : Math.abs(Math.cos(k * Math.PI * 6));
  const color = landed ? (win ? C.green : C.red) : C.gold;
  ctx.save(); ctx.translate(x, y - jump); ctx.scale(Math.max(.08, sx), 1);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 3; ctx.stroke();
  if (landed) {
    ctx.strokeStyle = C.white; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath();
    if (win) { ctx.moveTo(-r * .4, 0); ctx.lineTo(-r * .1, r * .3); ctx.lineTo(r * .45, -r * .35); }
    else { ctx.moveTo(-r * .35, -r * .35); ctx.lineTo(r * .35, r * .35); ctx.moveTo(r * .35, -r * .35); ctx.lineTo(-r * .35, r * .35); }
    ctx.stroke();
  } else text("$", 0, 1, F(900, r), "#78350f");
  ctx.restore();
}

// ============================================================
//  SMALL DRAWING HELPERS
// ============================================================
function check(x, y, r, win) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = win ? C.green : C.red; ctx.fill();
  ctx.strokeStyle = C.white; ctx.lineWidth = Math.max(3, r * .22); ctx.lineCap = "round"; ctx.beginPath();
  if (win) { ctx.moveTo(x - r * .4, y); ctx.lineTo(x - r * .1, y + r * .3); ctx.lineTo(x + r * .45, y - r * .35); }
  else { ctx.moveTo(x - r * .35, y - r * .35); ctx.lineTo(x + r * .35, y + r * .35); ctx.moveTo(x + r * .35, y - r * .35); ctx.lineTo(x - r * .35, y + r * .35); }
  ctx.stroke();
}
function popScale(t, t0, d = .45) { return pe(t, t0, t0 + d, backOut); }
function scaled(cx, cy, k, fn) { if (k <= 0) return; ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
function bullet(x, y, w, h, label, spent = 0) {
  // vertical bullet: tip on top
  ctx.save();
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, "#a16207"); g.addColorStop(.45, "#facc15"); g.addColorStop(1, "#854d0e");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(x, y + h * .35); ctx.quadraticCurveTo(x, y, x + w / 2, y); ctx.quadraticCurveTo(x + w, y, x + w, y + h * .35);
  ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#713f12"; ctx.fillRect(x - 3, y + h * .35, w + 6, Math.max(4, h * .04));
  if (label) text(label, x + w / 2, y + h * .68, F(900, Math.round(w * .28)), "#422006");
  if (spent > 0) { ctx.fillStyle = `rgba(5,8,14,${.75 * spent})`; ctx.fillRect(x - 4, y - 2, w + 8, h + 4); }
  ctx.restore();
}

// ============================================================
//  UI: titulares directos (sin burbuja de IA)
// ============================================================
function headline(parts, t, a, b, y = 330, size = 56) {
  // parts: [[text, color], ...] on one line, or array of lines via "\n" entries
  const al = sceneAlpha(t, a, b, .3, .3);
  if (al <= 0) return;
  const k = pe(t, a, a + .4, backOut);
  withAlpha(al, () => {
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(.9 + .1 * k, .9 + .1 * k);
    ctx.font = F(900, size); ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const total = parts.reduce((s, [tx]) => s + ctx.measureText(tx).width, 0);
    let x = -total / 2;
    for (const [tx, col] of parts) {
      ctx.lineWidth = 12; ctx.strokeStyle = "rgba(0,0,0,.75)"; ctx.lineJoin = "round"; ctx.strokeText(tx, x, 0);
      ctx.fillStyle = col; ctx.fillText(tx, x, 0); x += ctx.measureText(tx).width;
    }
    ctx.restore();
  });
}
function badge(label, color, bg, t, a, b, y = 240) {
  const al = sceneAlpha(t, a, b, .3, .3);
  withAlpha(al, () => {
    const k = pe(t, a, a + .4, backOut);
    scaled(W / 2, y, k, () => {
      ctx.font = F(900, 40); const w = ctx.measureText(label).width + 80;
      shadow(40, color, 0);
      rr(W / 2 - w / 2, y - 38, w, 76, 38); ctx.fillStyle = bg; ctx.fill(); noShadow();
      ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
      text(label, W / 2, y + 2, F(900, 40), color);
    });
  });
}
function photo(img, cx, cy, w, rot, k, opts = {}) {
  if (k <= 0) return;
  const h = img.naturalHeight * (w / img.naturalWidth);
  const pad = opts.pad ?? 14;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot * (opts.settle ? 1 : 1)); ctx.scale(k, k);
  shadow(60, "rgba(0,0,0,.7)", 24);
  rr(-w / 2 - pad, -h / 2 - pad, w + pad * 2, h + pad * 2, 16); ctx.fillStyle = opts.frame || "#f8fafc"; ctx.fill(); noShadow();
  ctx.save(); rr(-w / 2, -h / 2, w, h, 8); ctx.clip();
  if (opts.src) ctx.drawImage(img, ...opts.src, -w / 2, -h / 2, w, h); else ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore(); ctx.restore();
  return h;
}
function stamp(label, color, cx, cy, rot, k, size = 50) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); const s = 1.6 - .6 * k; ctx.scale(s, s); ctx.globalAlpha *= clamp(k * 2);
  ctx.font = F(900, size); const w = ctx.measureText(label).width + 50;
  rr(-w / 2, -size * .85, w, size * 1.7, 14); ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 7; ctx.stroke();
  text(label, 0, 3, F(900, size), color);
  ctx.restore();
}
function flash(t, t0) { const f = 1 - p(t, t0, t0 + .35); if (t >= t0 && f > 0) { ctx.fillStyle = `rgba(255,255,255,${.7 * f})`; ctx.fillRect(0, 0, W, H); } }
function ledger(rows, t, t0, y0 = 960) {
  // rows: [label, value, color, big?]
  rows.forEach(([lab, val, col, big], i) => {
    const tt = t0 + i * .7, k = pe(t, tt, tt + .4);
    if (k <= 0) return;
    const y = y0 + i * 98 + (big ? 14 : 0);
    withAlpha(k, () => {
      ctx.save(); ctx.translate((1 - k) * 60, 0);
      if (big) {
        shadow(40, "rgba(250,204,21,.35)", 0);
        rr(90, y - 54, 900, 108, 26); ctx.fillStyle = "rgba(250,204,21,.16)"; ctx.fill(); noShadow();
        ctx.strokeStyle = "rgba(250,204,21,.75)"; ctx.lineWidth = 3; ctx.stroke();
      } else { rr(90, y - 42, 900, 84, 20); ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fill(); }
      text(lab, 125, y + 2, F(big ? 900 : 700, big ? 38 : 32), big ? C.gold : C.muted, "left");
      text(val, 955, y + 2, F(900, big ? 60 : 46), col, "right");
      ctx.restore();
    });
  });
}
function cardPos(i, layout) {
  const col = i % 5, row = Math.floor(i / 5);
  return { x: layout.x0 + col * (layout.w + layout.gap), y: layout.y0 + row * (layout.h + layout.gap) };
}
// 10-account grid with per-card result
const G10 = { x0: 75, y0: 440, w: 170, h: 200, gap: 20 };
function grid10(t, t0, results, tRes, opts = {}) {
  // results[i]: "pay" | "burn" | "alive" ; label for pay
  for (let i = 0; i < 10; i++) {
    const cp = cardPos(i, G10);
    const k = popScale(t, t0 + i * .06, .4);
    const tr = tRes + i * .22, done = t > tr;
    const res = results[i];
    const glow = done && res === "pay" ? .75 + .25 * Math.sin(t * 6) : 0;
    const shake = done && res === "burn" && t < tr + .35 ? Math.sin(t * 90) * 8 * (1 - p(t, tr, tr + .35)) : 0;
    scaled(cp.x + G10.w / 2, cp.y + G10.h / 2, k, () => {
      ctx.save(); ctx.translate(shake, 0);
      accountCard(cp.x, cp.y, G10.w, G10.h, { price: !done, glow });
      if (done) {
        const d = p(t, tr, tr + .3);
        if (res === "burn") {
          rr(cp.x, cp.y, G10.w, G10.h, 18); ctx.fillStyle = `rgba(60,8,8,${.78 * d})`; ctx.fill();
          withAlpha(d, () => { ctx.save(); ctx.translate(cp.x + G10.w / 2, cp.y + G10.h * .62); ctx.rotate(-.22);
            rr(-78, -24, 156, 48, 10); ctx.strokeStyle = C.red; ctx.lineWidth = 4; ctx.stroke();
            text("QUEMADA", 0, 2, F(900, 26), C.redSoft); ctx.restore(); });
        } else if (res === "pay") {
          withAlpha(d, () => { rr(cp.x + 12, cp.y + G10.h * .64, G10.w - 24, 50, 25); ctx.fillStyle = C.green; ctx.fill();
            text(opts.payLabel || "PAYOUT", cp.x + G10.w / 2, cp.y + G10.h * .64 + 26, F(900, 24), C.ink); });
        } else if (res === "alive") {
          withAlpha(d, () => { rr(cp.x + 12, cp.y + G10.h * .64, G10.w - 24, 50, 25); ctx.fillStyle = "rgba(59,130,246,.85)"; ctx.fill();
            text("SIGUE VIVA", cp.x + G10.w / 2, cp.y + G10.h * .64 + 26, F(900, 20), C.white); });
        }
      }
      ctx.restore();
    });
  }
}

function infoLines(lines, t, a, b, y0 = 1330) {
  // lines: [[t0, text, color, size]]
  const al = sceneAlpha(t, a, b, .3, .3);
  withAlpha(al, () => lines.forEach(([t0, s, col, size = 38], i) => {
    const k = pe(t, t0, t0 + .4);
    if (k <= 0) return;
    withAlpha(k, () => {
      ctx.save(); ctx.translate(0, (1 - k) * 20);
      ctx.font = F(800, size); const w = Math.min(980, ctx.measureText(s).width + 50);
      rr(W / 2 - w / 2, y0 + i * 78 - 32, w, 64, 18); ctx.fillStyle = "rgba(0,0,0,.72)"; ctx.fill();
      text(s, W / 2, y0 + i * 78 + 1, F(800, size), col);
      ctx.restore();
    });
  }));
}

// ============================================================
//  ASSETS · fondos (IA) y captura real
// ============================================================
const imgDesk = new Image(); imgDesk.src = "assets/fondo-escritorio.webp";
const imgPaths = new Image(); imgPaths.src = "assets/fondo-caminos.webp";
const imgShot = new Image(); imgShot.src = "assets/captura-smt.webp";
const EXTRA_IMAGES = [imgDesk, imgPaths, imgShot];

// ============================================================

function tag(x, y, label, bgc, fg = C.ink, k = 1, size = 26) {

function dot(P, m, p, color, k = 1, r = 9) {
  if (k <= 0) return;
  ctx.beginPath(); ctx.arc(P.X(m), P.Y(p), r * k, 0, 7); ctx.fillStyle = color; ctx.fill();

}
function lowIn(sym, a, b, o = {}) { return series(sym, o).filter(k => k.t >= a && k.t <= b).reduce((x, k) => k.l < x.l ? k : x); }
function highIn(sym, a, b, o = {}) { return series(sym, o).filter(k => k.t >= a && k.t <= b).reduce((x, k) => k.h > x.h ? k : x); }

  [40.2, 60.0, "¿Y dónde se suele mirar? En zonas de liquidez: máximos y mínimos anteriores, y máximos y mínimos de la sesión. Ahí es donde una SMT suele tener más peso. En mitad de un rango, en cambio, no significa lo mismo."],
  [60.2, 75.0, "Y tres errores típicos al leerla. Uno: comparar temporalidades distintas. Dos: mirar la mecha en un gráfico y el cierre en el otro. Tres: usar horas de sesión que no coinciden."],
];

const CAPS = [];
for (const [a, b, s] of VO) {
  const words = s.split(" "); const chunks = []; let cur = [];
  for (const w of words) { cur.push(w); if (cur.length >= 6 || /[.:,]$/.test(w) && cur.length >= 3) { chunks.push(cur.join(" ")); cur = []; } }
  if (cur.length) chunks.push(cur.join(" "));
  const tot = chunks.reduce((n, c) => n + c.length + 6, 0); let acc = a;
  for (const c of chunks) { const d = (b - a) * (c.length + 6) / tot; CAPS.push([acc, acc + d, c]); acc += d; }
}
const HL = /(\d[\d.,]*\s?%?|EV|\+?\d[\d.]*\s?\$|payout|positivo|fondeada|todo o nada)/i;
function captions(t) {
  if (!CONFIG.captions) return;
  const c = CAPS.find(c => t >= c[0] && t < c[1]);
  if (!c) return;
  const k = pe(t, c[0], c[0] + .12, backOut);
  const font = F(900, 46);
  const lines = wrap(c[2], 900, font);
  ctx.save(); ctx.translate(W / 2, 1530); ctx.scale(.9 + .1 * k, .9 + .1 * k);
  lines.forEach((ln, i) => {
    const y = (i - (lines.length - 1) / 2) * 58;
    ctx.font = font; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    const words = ln.split(" "); const total = ctx.measureText(ln).width; let x = -total / 2;
    for (const w of words) {
      const ww = ctx.measureText(w + " ").width;
      ctx.lineWidth = 10; ctx.strokeStyle = "rgba(0,0,0,.85)"; ctx.lineJoin = "round"; ctx.strokeText(w, x, y);
      ctx.fillStyle = HL.test(w) ? C.gold : C.white; ctx.fillText(w, x, y);
      x += ww;
    }
  });
  ctx.restore();
}

// ============================================================

// ============================================================
//  MAIN
// ============================================================
function renderFrame(t) {
  ctx = document.getElementById("c").getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; noShadow();
  ctx.clearRect(0, 0, W, H);
  bg(t);
  scene1(t); scene2(t); scene3(t); scene3b(t); scene3c(t); scene4(t); scene5(t);
  captions(t);
  const fade = Math.max(1 - p(t, 0, .3), p(t, DURATION - .5, DURATION));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
window.renderFrame = renderFrame;
window.DURATION = DURATION;
window.ready = Promise.all([
  document.fonts.load(F(900, 40)), document.fonts.load(F(700, 40, "JBM")),
  imgBg.decode(), ...EXTRA_IMAGES.map(i => i.decode()),
]).then(() => document.fonts.ready);

// live preview when opened in a browser (no ?render)
if (!params.has("render")) {
  window.ready.then(() => {
    const start = performance.now() - (parseFloat(params.get("t")) || 0) * 1000;
    const loop = () => { renderFrame(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
  document.body.style.cssText = "display:flex;justify-content:center;background:#111";
  document.getElementById("c").style.cssText = "height:100vh;width:auto";
}
</script>
